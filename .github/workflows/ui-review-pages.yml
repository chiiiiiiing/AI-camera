name: Publish UI review

on:
  push:
    branches: [main]
    paths:
      - 'ui-review/**'
      - 'aicamera-app/app/src/main/res/drawable-nodpi/**'
      - 'aicamera-app/app/src/main/java/**'
      - '.github/workflows/ui-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-review-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ui-review/export.mjs
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo "Pages not enabled (HTTP $status); static artifact will still be uploaded."
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-static
          path: ui-review/dist
          include-hidden-files: true

  deploy:
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-review-static
          path: ui-review/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui-review/dist
      - id: deployment
        uses: actions/deploy-pages@v4
