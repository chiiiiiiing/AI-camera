name: Engine CI

on:
  push:
    paths: ['ai/engine/**', '.github/workflows/engine-ci.yml']
  pull_request:
    paths: ['ai/engine/**', '.github/workflows/engine-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cd ai/engine && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cd ai/engine && cmake --build build -j$(nproc)

      - name: Test
        run: cd ai/engine/build && ./engine_tests
