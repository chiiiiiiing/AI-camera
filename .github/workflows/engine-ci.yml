name: Engine CI

on:
  push:
    paths: ['ai/engine/**', 'ai/tools/**', '.github/workflows/engine-ci.yml']
  pull_request:
    paths: ['ai/engine/**', 'ai/tools/**', '.github/workflows/engine-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cd ai/engine && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cd ai/engine && cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir ai/engine/build --output-on-failure

  data-contract-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ai/tools/build_template_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model data test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10.4,<13' 'jsonschema>=4.23,<5' 'opencv-python-headless>=4.11,<5'
      - name: Validate model cache, training data, and index contracts
        run: |
          python -m unittest discover -s tests -p 'test_validate_template_index.py'
          python -m unittest discover -s tests -p 'test_evaluate_template_index_quality.py'
          python -m unittest discover -s tests -p 'test_validate_android_v9_assets.py'
          python -m unittest discover -s tests -p 'test_validate_core_recommendation_assets.py'
          python -m unittest discover -s tests -p 'test_validate_multiscene_assets.py'
          python -m unittest discover -s tests -p 'test_build_multiscene_references.py'
          python -m unittest discover -s tests -p 'test_run_core_recommendation.py'
          python -m unittest discover -s tests -p 'test_build_reference_structures.py'
          python -m unittest discover -s tests -p 'test_generate_onnx_embeddings.py'
          python -m unittest discover -s tests -p 'test_build_distillation_dataset.py'
          python -m unittest discover -s tests -p 'test_prepare_retrieval_data.py'
          python -m unittest discover -s tests -p 'test_evaluate_retrieval.py'
          python -m unittest discover -s tests -p 'test_recover_reference_crops.py'
          python -m unittest discover -s tests -p 'test_validate_template_metadata.py'

  student-model-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ai/tools/build_template_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model test dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10.4,<13' onnx==1.17.0 onnxruntime==1.19.2
      - name: Validate training objectives, selection, and quantization
        run: |
          python -m unittest discover -s tests -p 'test_train_student_embedding.py'
          python -m unittest discover -s tests -p 'test_optimize_student_retrieval.py'
          python -m unittest discover -s tests -p 'test_quantize_onnx_static.py'
          python -m unittest discover -s tests -p 'test_export_student_model.py'
          python -m unittest discover -s tests -p 'test_benchmark_onnx_retrieval.py'
          python -m unittest discover -s tests -p 'test_build_reviewed_reference_bundle.py'
          python -m unittest discover -s tests -p 'test_train_transfer_retrieval.py'
          python -m unittest discover -s tests -p 'test_evaluate_frozen_retrieval.py'
          python -m unittest discover -s tests -p 'test_prepare_quality_teacher.py'
          python -m unittest discover -s tests -p 'test_train_guidance_quality.py'
          python -m unittest discover -s tests -p 'test_multiscene_detector.py'
