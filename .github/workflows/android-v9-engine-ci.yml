name: Android V9 Engine CI

on:
  push:
    paths:
      - 'aicamera-app/**'
      - 'ai/tools/validate_android_v9_assets.py'
      - 'ai/tools/validate_core_recommendation_assets.py'
      - 'ai/tools/build_template_db/validate_template_index.py'
      - '.github/workflows/android-v9-engine-ci.yml'
  pull_request:
    paths:
      - 'aicamera-app/**'
      - 'ai/tools/validate_android_v9_assets.py'
      - 'ai/tools/validate_core_recommendation_assets.py'
      - 'ai/tools/build_template_db/validate_template_index.py'
      - '.github/workflows/android-v9-engine-ci.yml'

jobs:
  unit-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: aicamera-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate packaged V9 assets
        run: python3 ../ai/tools/validate_android_v9_assets.py --asset-root app/src/main/assets/ai/v9

      - name: Run V9 engine unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: aicamera-app/app/build/reports/tests/
          if-no-files-found: ignore
