name: Android V9 Engine CI

on:
  push:
    paths:
      - 'app-arch/aicamera-app/**'
      - 'ai/tools/validate_android_v9_assets.py'
      - '.github/workflows/android-v9-engine-ci.yml'
  pull_request:
    paths:
      - 'app-arch/aicamera-app/**'
      - 'ai/tools/validate_android_v9_assets.py'
      - '.github/workflows/android-v9-engine-ci.yml'

jobs:
  unit-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app-arch/aicamera-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate packaged V9 assets
        run: python3 ../../ai/tools/validate_android_v9_assets.py --asset-root app/src/main/assets/ai/v9

      - name: Run V9 engine unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
