<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenWow · UI 验收工作台</title><link rel="stylesheet" href="./style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="./index.html"><span class="brandmark">G</span><span>帧好 GenWow<small>UI REVIEW WORKSPACE</small></span></a><p class="nav-caption">页面与图层</p><nav id="catalog"></nav><footer>交互预览 · 非 Android 运行环境</footer></aside>
<main><header class="workspace-header"><div><span class="eyebrow">DESIGN ACCEPTANCE / 验收站</span><h1 id="page-title"></h1><p id="page-note"></p></div><span id="connection" class="pill">连接中</span></header>
<div class="toolbar"><label>画布 <select id="viewport"><option value="390">390 × 844</option><option value="360">360 × 800 窄屏</option><option value="430">430 × 932</option><option value="landscape">844 × 390 横屏</option></select></label><label>场景 <select id="scenario"></select></label><button id="copy-link">复制当前验收链接</button><button id="reset">重置演示数据</button></div>
<div class="stage-layout"><section class="stage"><div class="device" id="device"><div class="statusbar"><span>9:41</span><span>▂▄▆ · ▰</span></div><div id="app"></div></div><div id="stage-controls" class="stage-controls"></div><p class="stage-caption">操作按钮可体验交互；参数与账号数据仅保存在此浏览器。</p></section>
<aside class="inspector"><section><h2>当前页面 · 实现依据</h2><p id="fidelity"></p><div id="sources"></div><p id="source-status" class="notice"></p></section><section><h2>图层检查</h2><div id="layers"></div><label class="check"><input type="checkbox" id="outline">显示图层边界</label></section><section><h2>本页验收意见</h2><label>结论<select id="verdict"><option>待验收</option><option>需要修改</option><option>已通过</option></select></label><textarea id="feedback" placeholder="例如：旋转提示挡住人脸；请将按钮下移…"></textarea><button id="save-feedback">保存本页意见</button><button id="export-feedback">导出全部验收意见</button><small>记录包含页面、状态、画布尺寸、源代码版本。保存在浏览器中，导出后可交给开发。</small></section></aside></div>
</main><div id="toast" role="status"></div><script type="module" src="./app.js"></script>
</body></html>
